    <script>
      // Initialize Lucide Icons
      lucide.createIcons();

      // Data for Slider
      const slideData = [
          { id: 0, title: '游戏设计', image: 'https://images.unsplash.com/photo-1552820728-8b83bb6b773f?q=80&w=2000&auto=format&fit=crop' },
          { id: 1, title: '动效设计', image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2000&auto=format&fit=crop' },
          { id: 2, title: 'UI 设计', image: 'https://images.unsplash.com/photo-1561070791-2526d30994b5?q=80&w=2000&auto=format&fit=crop' },
          { id: 3, title: '图标管理', image: 'https://images.unsplash.com/photo-1611162617474-5b21e879e113?q=80&w=2000&auto=format&fit=crop' },
          { id: 4, title: '字体管理', image: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop' }, // Default Active
          { id: 5, title: '音频管理', image: 'https://images.unsplash.com/photo-1611339555312-e607c83ce057?q=80&w=2000&auto=format&fit=crop' },
          { id: 6, title: '视频管理', image: 'https://images.unsplash.com/photo-1536240478700-b869070f9279?q=80&w=2000&auto=format&fit=crop' },
          { id: 7, title: 'GIF 播放器', image: 'https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=2000&auto=format&fit=crop' },
          { id: 8, title: '字体预览', image: 'https://images.unsplash.com/photo-1515595967223-f9fa59af5a3b?q=80&w=2000&auto=format&fit=crop' }
      ];

      let currentIndex = 4; // Start at "字体管理"

      const mainDisplay = document.getElementById('main-display');
      const thumbnailContainer = document.getElementById('thumbnail-container');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');

      // Render Thumbnails
      function renderThumbnails() {
          thumbnailContainer.innerHTML = '';
          slideData.forEach((slide, index) => {
              const isActive = index === currentIndex;

              const thumbEl = document.createElement('div');
              thumbEl.className = `flex-shrink-0 w-28 md:w-32 snap-center cursor-pointer group flex flex-col items-center gap-3 transition-all duration-300`;
              thumbEl.onclick = () => goToSlide(index);
              thumbEl.id = `thumb-${index}`;

              // Image Box
              const imgBoxClasses = isActive
                  ? 'ring-2 ring-blue-500 ring-offset-2 ring-offset-[#050505] opacity-100 scale-100'
                  : 'ring-1 ring-white/10 opacity-40 group-hover:opacity-80 scale-95 group-hover:scale-100';

              // Text
              const textClasses = isActive
                  ? 'text-white font-medium'
                  : 'text-zinc-500 font-normal group-hover:text-zinc-300';

              thumbEl.innerHTML = `
                  <div class="w-full aspect-[4/3] rounded-lg overflow-hidden transition-all duration-300 ease-out ${imgBoxClasses}">
                      <img src="https://hoirqrkdgbmvpwutwuwj.supabase.co/storage/v1/object/public/assets/assets/917d6f93-fb36-439a-8c48-884b67b35381_1600w.jpg" class="w-full h-full object-cover" alt="${slide.title}">
                  </div>
                  <span class="text-xs tracking-wide transition-colors duration-200 ${textClasses}">${slide.title}</span>
              `;
              thumbnailContainer.appendChild(thumbEl);
          });

          updateArrowStates();
      }

      // Update active slide
      function goToSlide(index) {
          if (index === currentIndex) return;

          // Fade out main image
          mainDisplay.style.opacity = '0';

          setTimeout(() => {
              currentIndex = index;
              mainDisplay.src = slideData[currentIndex].image;

              // Fade in new image
              mainDisplay.style.opacity = '1';

              // Re-render thumbnails to update active state visually
              renderThumbnails();
              scrollToActiveThumbnail();
          }, 150); // half of css transition duration
      }

      function scrollToActiveThumbnail() {
          const activeThumb = document.getElementById(`thumb-${currentIndex}`);
          if (activeThumb) {
              // Center the active thumbnail in the container
              const containerCenter = thumbnailContainer.offsetWidth / 2;
              const thumbCenter = activeThumb.offsetLeft + (activeThumb.offsetWidth / 2);
              const scrollPos = thumbCenter - containerCenter;

              thumbnailContainer.scrollTo({
                  left: scrollPos,
                  behavior: 'smooth'
              });
          }
      }

      function updateArrowStates() {
          btnPrev.disabled = currentIndex === 0;
          btnNext.disabled = currentIndex === slideData.length - 1;
      }

      // Event Listeners for Arrows
      btnPrev.addEventListener('click', () => {
          if (currentIndex > 0) goToSlide(currentIndex - 1);
      });

      btnNext.addEventListener('click', () => {
          if (currentIndex < slideData.length - 1) goToSlide(currentIndex + 1);
      });

      // Initialize Slider
      renderThumbnails();
      // Initial slight delay scroll to center active item on load
      setTimeout(scrollToActiveThumbnail, 100);


      // Scroll Animation Logic using Intersection Observer
      const observerOptions = {
          root: null,
          rootMargin: '0px',
          threshold: 0.1
      };

      const observer = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
              if (entry.isIntersecting) {
                  entry.target.classList.remove('opacity-0', 'translate-y-6', 'translate-y-8');
                  entry.target.classList.add('opacity-100', 'translate-y-0');
                  observer.unobserve(entry.target);
              }
          });
      }, observerOptions);

      document.querySelectorAll('.scroll-anim').forEach(el => {
          observer.observe(el);
      });
    </script>

    <script>
      (function() {
          const aiObserver = new IntersectionObserver((entries, obs) => {
              entries.forEach(entry => {
                  if (entry.isIntersecting) {
                      entry.target.classList.remove('opacity-0', 'translate-y-12', '-translate-x-8', 'translate-x-8', 'translate-y-8');
                      entry.target.classList.add('opacity-100', 'translate-y-0', 'translate-x-0');
                      obs.unobserve(entry.target);
                  }
              });
          }, { threshold: 0.1 });

          document.querySelectorAll('.ai-scroll-anim').forEach(el => aiObserver.observe(el));

          const aiTabs = document.querySelectorAll('.ai-tab');
          const aiTabPill = document.getElementById('ai-tab-pill');
          const aiGallery = document.getElementById('ai-gallery');
          const aiLoading = document.getElementById('ai-loading');
          const aiLoadingText = document.getElementById('ai-loading-text');
          const aiTopBarText = document.getElementById('ai-top-bar-text');

          const catBaseImages = [
              "https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1573865526739-10659fec78a5?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1495360010541-f48722b34f7d?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1513360371669-4adf3dd7dff8?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1533738363-b7f9aef128ce?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1574158622682-e40e69881006?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1543852786-1cf6624b9987?q=80&w=400&auto=format"
          ];

          const catPinkImages = [
              "https://images.unsplash.com/photo-1561948955-570b270e7c36?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1519052537078-e6302a4968d4?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1478098711619-5ab0b478d6e6?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1548247416-ec66f4900b2e?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1526336024174-e58f5cdd8e13?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1501820488136-72669149e0d4?q=80&w=400&auto=format",
              "https://images.unsplash.com/photo-1555685812-4b943f1cb0eb?q=80&w=400&auto=format"
          ];

          const catMixImages = [...catBaseImages].reverse();

          const tabData = [
              { images: catBaseImages, text: "正在匹配图像相似度...", label: "以图找图" },
              { images: catPinkImages, text: "正在生成语义提示词: '粉色背景的猫'...", label: "语义搜索" },
              { images: catMixImages, text: "正在跨平台比对资源...", label: "跨平台搜索" }
          ];

          let currentAiIndex = 0;

          function renderAiGallery(index) {
              if(aiLoading) aiLoading.classList.remove('opacity-0', 'pointer-events-none');
              if(aiLoadingText) aiLoadingText.innerText = tabData[index].text;
              if(aiTopBarText) aiTopBarText.innerText = tabData[index].label;

              setTimeout(() => {
                  if(aiGallery) aiGallery.innerHTML = '';

                  setTimeout(() => {
                      if(aiLoading) aiLoading.classList.add('opacity-0', 'pointer-events-none');

                      tabData[index].images.forEach((src, i) => {
                          const imgEl = document.createElement('div');
                          imgEl.className = 'relative rounded-xl overflow-hidden group/item mb-3 transform scale-95 opacity-0 transition-all duration-500 ease-out cursor-pointer break-inside-avoid shadow-md bg-[#1f222e]';
                          imgEl.style.transitionDelay = (i * 50) + 'ms';

                          const matchPercent = Math.floor(Math.random() * 10) + 90;

                          imgEl.innerHTML = `
                              <img src="${src}" class="w-full h-auto object-cover transition-transform duration-700 ease-out group-hover/item:scale-105" alt="AI Result" loading="lazy">
                              <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover/item:opacity-100 transition-opacity duration-300 flex flex-col justify-between p-3 pointer-events-none">
                                  <div class="flex justify-end">
                                      <span class="bg-blue-500/90 text-white text-[10px] font-medium px-1.5 py-0.5 rounded backdrop-blur-md shadow-sm border border-white/10">${matchPercent}% 匹配</span>
                                  </div>
                                  <div class="text-white text-xs font-medium translate-y-2 opacity-0 group-hover/item:translate-y-0 group-hover/item:opacity-100 transition-all duration-300">
                                      AI 智能检索
                                  </div>
                              </div>
                          `;
                          if(aiGallery) aiGallery.appendChild(imgEl);

                          setTimeout(() => {
                              imgEl.classList.remove('scale-95', 'opacity-0');
                              imgEl.classList.add('scale-100', 'opacity-100');
                          }, 50);
                      });

                  }, 500);
              }, 100);
          }

          if(aiTabs.length > 0) {
              aiTabs.forEach((tab, idx) => {
                  tab.addEventListener('click', () => {
                      if(currentAiIndex === idx) return;
                      currentAiIndex = idx;

                      if(aiTabPill) aiTabPill.style.transform = 'translateY(' + (idx * 48) + 'px)';

                      aiTabs.forEach((t, i) => {
                          const iconWrap = t.querySelector('.tab-icon');
                          const textSpan = t.querySelector('.tab-text');

                          if (i === idx) {
                              if(iconWrap) {
                                  iconWrap.classList.remove('text-zinc-500', 'group-hover:text-zinc-400');
                                  iconWrap.classList.add('text-blue-400');
                              }
                              if(textSpan) {
                                  textSpan.classList.remove('text-zinc-400', 'group-hover:text-zinc-300');
                                  textSpan.classList.add('text-white');
                              }
                          } else {
                              if(iconWrap) {
                                  iconWrap.classList.add('text-zinc-500', 'group-hover:text-zinc-400');
                                  iconWrap.classList.remove('text-blue-400');
                              }
                              if(textSpan) {
                                  textSpan.classList.add('text-zinc-400', 'group-hover:text-zinc-300');
                                  textSpan.classList.remove('text-white');
                              }
                          }
                      });

                      renderAiGallery(idx);
                  });
              });

              renderAiGallery(0);
              if(window.lucide) window.lucide.createIcons();
          }
      })();
    </script>
  
</body></html>
